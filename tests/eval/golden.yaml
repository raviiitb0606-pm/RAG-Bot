# Golden evaluation set — Phase 1 seed (P1.6, arch §14.1).
#
# `must_contain` (P2.9) was filled in from the fetched pages (`mf-faq ingest --dump <source_id>`,
# corpus 2026-10-25), never from memory; tests/unit/test_corpus_files.py checks every value is in
# the expected page's chunks. NAV, fund size and expense ratio change over time: refresh these
# values (and tests/fixtures/groww/) after a re-ingest (P9.7). Grown to 50-70 cases in P9.1.
#
# Fields:
#   id            unique case id
#   q             user message (single-turn case), or `turns:` for a thread (follow-ups)
#   expect_kind   answer | refusal | performance | pii | not_found | multi_scheme | help
#   expect_source registry id of the expected cited / linked page (omit when the link rule decides)
#   fact          for `answer` cases: key from the scheme's available_facts (corpus/schemes.yaml)
#   edge_case     optional id from docs/edge-case.md
#   must_contain  values a correct answer must contain, copied from the page (P2.9)

# --- Factual: 3-5 per scheme, drawn from available_facts, plus one holdings case each (P3.5) ----

- id: F-LC-01
  q: "What is the expense ratio of HDFC Large Cap Fund – Direct Growth?"
  expect_kind: answer
  expect_source: groww-hdfc-large-cap
  fact: expense_ratio
  must_contain: ["1.02%"]
- id: F-LC-02
  q: "What is the exit load of HDFC Large Cap Fund?"
  expect_kind: answer
  expect_source: groww-hdfc-large-cap
  fact: exit_load
  must_contain: ["1%", "1 year"]
- id: F-LC-03
  q: "What is the benchmark of HDFC Large Cap Fund?"
  expect_kind: answer
  expect_source: groww-hdfc-large-cap
  fact: benchmark
  must_contain: ["NIFTY 100"]
- id: F-LC-04
  q: "Who manages HDFC Large Cap Fund?"
  expect_kind: answer
  expect_source: groww-hdfc-large-cap
  fact: fund_managers
  must_contain: ["Rahul Baijal", "Dhruv Muchhal"]
- id: F-LC-05
  q: "What is the largest holding of HDFC Large Cap Fund?"
  expect_kind: answer
  expect_source: groww-hdfc-large-cap
  fact: holdings
  must_contain: ["ICICI Bank", "9.79%"]

