# Retrieval query sets (P3.5), merged from the Phase 3 data research (docs/research/phase3/queries.py).
#
# `mf-faq eval --retrieval-only` runs these together with the answer / not_found / multi_scheme
# cases of golden.yaml, through the real scheme resolver, not-found layers and retriever. The
# same eval is the swap gate of `mf-faq index` (P3.1). Same fields as golden.yaml:
#   expect_kind   answer | not_found | needs_scheme | multi_scheme
#   expect_source registry id of the page whose chunk must be retrieved (answer cases)
#   fact          a key from that scheme's available_facts; a hit is a retrieved chunk with it
#   must_contain  optional: the hit chunk must also contain these (holdings in a later part)
#
# Sets:
#   paraphrase    hand-written questions that avoid the section labels on purpose
#   heldout       written before any chunk or BM25 variant was tried; never used to pick the
#                 "Covers" wording (schemes.yaml fact_groups)
#   holdings      holdings questions whose answer is in a specific part of a split holdings list
#   ooc_scheme    out of corpus with a supported scheme named: layers C/D must stop them
#   ooc_general   out of corpus with no supported scheme: layers A/B must stop them
#   near_miss     the right section matches but the thing asked isn't on the page. Retrieval
#                 can't tell (research §3.5); reported only, left to the LLM (Phase 5, P9)
#
# Caveat (research §5): one person wrote these questions, the Covers wording and the lexicon.
# P9.1 adds cases written by someone else.


