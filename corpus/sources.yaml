# The RAG corpus: exactly these 5 Groww scheme pages (implementation-plan §0, P1.2).
# Every url must be in ALLOWED_URLS (src/mf_faq/ingest/registry.py). Nothing else is ever added.
#
# P1.3 findings (checked 25 Oct 2026, plain HTTP GET, no JavaScript):
# - All 5 pages are server-rendered (Next.js). The visible HTML holds every fact section, and the
#   same data is embedded as JSON in <script id="__NEXT_DATA__"> at props.pageProps.mfServerSideData.
# - That JSON has stale or wrong fields, so the parser (P2.3) must prefer the VISIBLE sections or
#   the JSON fields that match them:
#     * top-level `fund_manager` is stale (e.g. "Prashant Jain" for Large Cap); use `fund_manager_details`
#       (which is what the page's "Fund management" section shows);
#     * `nfo_risk` (e.g. "Moderately High") differs from the risk the page shows ("Very High"); use `risk`;
#     * `category_info.sub_type` says "Contra" for all 4 equity funds; use `category` + `sub_category`.
# - The JSON also carries returns (`stats`, `return_stats`, `sip_return`, `simple_return`,
#   `peerComparison`, `analysis`): all must be dropped (P2.4).
# - playwright is NOT needed.

