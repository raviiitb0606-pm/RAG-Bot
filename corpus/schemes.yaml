# P3.2: other fund houses. The resolver checks these first: generic aliases ("small cap fund",
# "silver fof") score 100 against "SBI Small Cap Fund" or "Nippon India Silver ETF FoF"
# (docs/research/phase3-data-research.md §3.7), which would be answered with HDFC figures.
# A name counts as a fund house only when a fund word follows it ("SBI Small Cap Fund",
# "Kotak MF") and not when a company word does ("ICICI Bank", "SBI Funds Management",
# "Tata Motors"): those companies are in the holdings lists, which are answerable.
other_amcs:
  # On their own ("exit load of SBI?") they still stop a follow-up carrying over the thread's
  # scheme. Longer names are matched first ("ICICI Prudential" before "ICICI", "Bajaj Finserv"
  # before "Bajaj").
