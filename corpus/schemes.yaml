# The 5 supported schemes (P1.4, P1.5, arch §5.1).
#
# Everything here was read from the live Groww pages on 25 Oct 2026, not from memory.
# Fact *values* are not stored here: they come from ingestion (Phase 2) so they can't go stale here.
#
# available_facts = facts that are actually shown on the page. Only these are answerable.
# Applied defaults from docs/edge-case.md §15 (owner may override):
#   D-01 NAV and fund size are answerable, quoting the page's "as of" date.
#   D-02 tax rules are answerable, restating the page's rule only; never a personal calculation.
#   D-03 ratings / badges / pros & cons are opinion and are excluded.
#   D-12 other HDFC scheme names go in not_in_scope and are checked before alias matching.

# Canonical fact keys -> wording used in the help / not_found templates (P4.3).
fact_labels:
  expense_ratio: expense ratio
  exit_load: exit load
  min_sip: minimum SIP amount
  min_lumpsum: minimum first (lump-sum) investment
  min_additional: minimum additional investment
  risk_level: risk level (riskometer)
  benchmark: benchmark
  fund_managers: fund managers
  fund_size: fund size (AUM)
  nav: latest NAV
  category: category
  investment_objective: investment objective
  stamp_duty: stamp duty
  tax_implication: tax implication
  holdings: portfolio holdings
  fund_house: fund house details
  registrar: registrar and transfer agent
  custodian: custodian

# Fact group (chunk) -> the "Covers:" line written after each chunk's context header (P3.0).
# It describes the section in the words users ask with ("TER", "who runs", "RTA"), which closes
# the vocabulary gap between questions and section labels (research §3.2). Rules:
#   - never a fact value: no digits, no %, no names (a test checks);
#   - changing the wording changes the vectors: re-run `mf-faq eval --retrieval-only` and
#     re-derive the threshold (P3.6).
fact_groups:
  category_risk:
    covers: "category, type of fund, risk level, riskometer, how risky the fund is"
  nav:
    covers: "NAV, net asset value, price of one unit"
  fund_size:
    covers: "fund size, AUM, assets under management, how big the fund is"
  expense_ratio:
    covers: "expense ratio, TER, total expense ratio, annual fee, yearly cost of holding the fund"
  minimum_investments:
    covers: "minimum investment, minimum SIP, lump sum, first investment, additional top-up, amount needed to start"
  exit_load:
    covers: "exit load, redemption charge, penalty or fee for withdrawing or selling units early"
  stamp_duty:
    covers: "stamp duty charged on purchase of units"
  tax_implication:
    covers: "tax, taxation of gains, capital gains tax, STCG, LTCG, short term and long term"
  fund_management:
    covers: "fund manager, who manages or runs the fund, portfolio manager, managing since, education and experience"
  investment_objective:
    covers: "investment objective, aim, goal, what the fund invests in"
  benchmark:
    covers: "benchmark index the fund is measured against"
  holdings:
    covers: "portfolio holdings, stocks, shares and companies the fund owns, weight of each holding"
  fund_house:
    covers: "fund house, AMC, asset management company, contact phone number and address"
  custodian:
    covers: "custodian bank that holds the fund's securities in safe custody"
  registrar:
    covers: "registrar and transfer agent, RTA"

# Shown on the pages but deliberately NOT answerable. Phase 2 strips or skips these (P2.3, P2.4).
excluded_page_content:
  - item: "Returns: header '3Y annualised', return calculator, 'Returns and rankings' table, category average, rank"
    reason: "CR-2 (no performance figures); stripped at ingestion"
  - item: "NAV chart / NAV history"
    reason: "CR-2; only the latest NAV with its date is kept (D-01)"
  - item: "'Compare similar funds' peer table"
    reason: "Peer comparison is performance data (CR-2)"
  - item: "Groww 'Rating' (1-5) and pros/cons analysis"
    reason: "Opinion, not fact (D-03, CR-1)"
  - item: "Auto-generated 'About <scheme>' paragraph"
    reason: "Wrong values: it gives the AMC's incorporation date (10 Dec 1999) as the scheme launch date and the AMC's total AUM as the fund's AUM"
  - item: "Scheme launch date"
    reason: "Only shown in the unreliable 'About' paragraph, so questions about it get not_found"
  - item: "Lock-in"
    reason: "Not shown on any of the 5 pages (none of them has a lock-in), so not_found (edge case SCP-09)"

