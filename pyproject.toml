[project]
name = "mf-faq"
version = "0.1.0"
description = "Facts-only FAQ assistant for 5 HDFC Mutual Fund schemes (RAG over their Groww pages)"
readme = "README.md"
authors = [
    { name = "raviiitb0606-pm", email = "raviiitb0606@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5",
    "fastapi>=0.162.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14.6",
    "sentence-transformers>=6.2.0",
    "slowapi>=0.1.10",
    "torch>=2.14.1",  # direct only so the CPU-index source below applies (sentence-transformers)
    "trafilatura>=2.3.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
mf-faq = "mf_faq.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

# CPU-only torch on Linux (Railway image, GitHub runners): no GPU there, and the default PyPI
# wheel pulls in several GB of CUDA libraries. macOS keeps the PyPI wheel. Deployment plan D1.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
